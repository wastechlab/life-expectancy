name: Release

# Publishing a GitHub release publishes the package. npm signs it with provenance, which ties the published
# files to this workflow run and this commit.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "$TAG" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm test
      # Once the package has a trusted publisher on npm, publishing goes through OIDC and NPM_TOKEN is not set.
      # The token exists only for the very first version, which npm requires before a trusted publisher can be
      # configured.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
